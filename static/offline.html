<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#11151f">
  <title>4X4 COUKOO — Offline</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background:#11151f; color:#f8fbff; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; box-sizing:border-box; }
    main { width:min(100%, 470px); padding:32px; border:1px solid rgba(255,255,255,.14); border-radius:22px; background:linear-gradient(145deg,#1d2432,#11151f); box-shadow:0 24px 80px rgba(0,0,0,.38); }
    p { color:#c9d2df; line-height:1.6; } h1 { margin:0 0 12px; letter-spacing:.035em; } .mark { color:#f29c38; font-weight:800; letter-spacing:.14em; font-size:12px; }
    button { border:0; border-radius:999px; padding:13px 20px; color:#11151f; background:#f29c38; font:inherit; font-weight:800; cursor:pointer; }
  </style>
</head>
<body>
  <main>
    <div class="mark">SARHANG IO</div>
    <h1>4X4 COUKOO is offline</h1>
    <p>Your connection is unavailable. Reconnect to the internet, then open the game again. After the driving world has loaded once, your browser may keep recently used game files available offline.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
